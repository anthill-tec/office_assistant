[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vidushi-oa"
dynamic = ["version"]                # single source: the git tag (hatch-vcs)
description = "Vidushi office-assistant data CLI and shared store (pluggable-backend: SQLite/Mongo)."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Antony John" }]
keywords = ["cli", "office-assistant", "email", "imap", "jmap", "sqlite", "mongodb", "toon", "axi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "jsonschema>=4",
    "toon-format==0.9.0b1",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.16"]
sqlite = ["jsonschema>=4"]
mail = ["keyring>=24"]
# CI/dev test backend: a real, storable keyring so the keyring-fallback test exercises an
# actual keyring (pointed at a hermetic temp file), not a no-op backend.
test = ["keyrings.alt>=5"]

[project.urls]
Homepage = "https://github.com/anthill-tec/office_assistant"
Repository = "https://github.com/anthill-tec/office_assistant"
Issues = "https://github.com/anthill-tec/office_assistant/issues"

[project.scripts]
voa = "vidushi_oa.cli:main"

# Version comes from the git tag (no static literal, no version-bump commit). setuptools_scm
# under the hood; no-local-version strips the PEP 440 '+g<sha>' segment so TestPyPI accepts it.
[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.targets.wheel]
packages = ["vidushi_oa"]
# `packages` already bundles vidushi_oa/schema/*.json; `artifacts` just pins the
# packaging intent for the schema validators (a pattern set, not a source->dest map).
artifacts = ["vidushi_oa/schema/*.json"]
