[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vidushi-oa"
dynamic = ["version"]                # single source: the git tag (hatch-vcs)
description = "Vidushi office-assistant data CLI and shared store (pluggable-backend: SQLite/Mongo)."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Antony John" }]
keywords = ["cli", "office-assistant", "email", "imap", "jmap", "sqlite", "mongodb", "toon", "axi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "jsonschema>=4",
    "keyring>=24",
    "toon-format==0.9.0b1",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.16"]
sqlite = ["jsonschema>=4"]
# CI/dev test backend: a real, storable keyring so the keyring-fallback test exercises an
# actual keyring (pointed at a hermetic temp file), not a no-op backend.
test = ["keyrings.alt>=5"]
# LOCAL-ONLY E2E mail tier (DN-mail-e2e-emulator-testing.md): a session-scoped
# testcontainers fixture spins up ONE throwaway Stalwart mail server and seeds the
# fastmail/gmail/yahoo provider profiles. Never installed in CI; the seeding uses only
# the stdlib (imaplib/smtplib/urllib/socket), so testcontainers is the sole dependency.
e2e = ["testcontainers>=4"]

[project.urls]
Homepage = "https://github.com/anthill-tec/office_assistant"
Repository = "https://github.com/anthill-tec/office_assistant"
Issues = "https://github.com/anthill-tec/office_assistant/issues"

[project.scripts]
voa = "vidushi_oa.cli:main"

# Version comes from the git tag (no static literal, no version-bump commit). setuptools_scm
# under the hood; no-local-version strips the PEP 440 '+g<sha>' segment so TestPyPI accepts it.
[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.targets.wheel]
packages = ["vidushi_oa"]
# `packages` already bundles vidushi_oa/schema/*.json; `artifacts` just pins the
# packaging intent for the schema validators (a pattern set, not a source->dest map).
artifacts = ["vidushi_oa/schema/*.json"]

[tool.pytest.ini_options]
# The `e2e` tier (tests/e2e/, DN-mail-e2e-emulator-testing.md) is a LOCAL, pre-release-only
# smoke pass against a Dockerized Stalwart emulator — it must NEVER be part of the normal
# test population (CI, regression, the release checklist's `pytest tests/ -q` full-suite run).
# `addopts = -m "not e2e"` FILTERS IT OUT BY CONSTRUCTION: the default `pytest tests/` never
# collects an e2e test. Running it is an explicit opt-in that overrides the default —
# `pytest -m e2e` (see the `make e2e` target). The container/extra auto-skip in tests/e2e/
# conftest.py is a secondary guard; this exclusion is the primary mechanism.
addopts = "-m 'not e2e'"
markers = [
    "e2e: LOCAL-only Dockerized-emulator smoke tests (opt-in via `-m e2e`; excluded by default).",
]
