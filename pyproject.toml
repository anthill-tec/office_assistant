[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidushi-oa"
version = "0.1.0"
description = "Vidushi office-assistant data CLI and shared store (MongoDB-backed)."
requires-python = ">=3.10"
dependencies = [
    "pymongo>=4.16",
    "python-toon>=0.1.3,<0.2",
]

[project.scripts]
voa = "vidushi_oa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vidushi_oa"]

[tool.hatch.build.targets.wheel.force-include]
"vidushi_oa/schema" = "vidushi_oa/schema"
