[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidushi-oa"
version = "0.1.0"
description = "Vidushi office-assistant data CLI and shared store (MongoDB-backed)."
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4",
    "python-toon>=0.1.3,<0.2",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.16"]
sqlite = ["jsonschema>=4"]

[project.scripts]
voa = "vidushi_oa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vidushi_oa"]
# `packages` already bundles vidushi_oa/schema/*.json; `artifacts` just pins the
# packaging intent for the schema validators (a pattern set, not a source->dest
# map, so it can't raise the force-include "second file being added" error).
artifacts = ["vidushi_oa/schema/*.json"]
