name: CI

on:
  push:
    branches:
      - "**"
      - "release/**"
      - "master"
      - "develop"
    tags:
      - "v*"

jobs:
  test:
    name: Build wheel, run tests, release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project + build/test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest
          python -m pip install -e ".[mongo,sqlite]"

      - name: Build wheel
        run: python -m build --wheel

      - name: Run pytest
        run: python -m pytest

      - name: Model-B release gate
        # Vendored copy of the generic skill-release gate so remote runners (no ~/.claude) can run it.
        run: python3 scripts/skill-release-gate.py --project-dir .

  # Validates packaging/deploy during a git-flow release (the release/* branch also hosts the
  # no-mistakes + AXI-qualification steps, run by the orchestrator).
  test-publish:
    name: Publish to TestPyPI
    needs: test
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vidushi-oa
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # AUTOMATED production release from master (git-flow release-finish tags master → CI publishes);
  # gated to master only; OIDC trusted publishing (the `pypi` environment scopes the trusted
  # publisher). No manual-reviewer gate — the branch is the gate.
  publish:
    name: Publish to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vidushi-oa
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
