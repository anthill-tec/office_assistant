name: CI

on:
  push:
    branches:
      - "**"
      - "release/**"
      - "main"
      - "develop"

jobs:
  test:
    name: Build wheel, run tests, release gate
    runs-on: ubuntu-latest
    # The suite's mongo-backed tests (CR-001..007, CR-017 AXI, import/snapshot) connect to a live
    # mongod on 127.0.0.1:27017. SQLite is the default backend, but these exercise the Mongo path,
    # so CI provides a mongod service container (a GitHub runner has none by default).
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project + build/test deps (repo .venv, mirrors local dev)
        # Create + use a repo-root .venv so .venv/bin/python exists on the runner:
        # CleanVenvPackagingTest builds a wheel via that interpreter, and it mirrors the
        # local `.venv/bin/python -m pytest` flow exactly. The [test] extra pulls keyrings.alt
        # (a real, storable keyring backend) so the keyring-fallback test has a working keyring.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install build pytest
          .venv/bin/python -m pip install -e ".[mongo,sqlite,mail,test]"

      - name: Build wheel
        run: .venv/bin/python -m build --wheel

      - name: Run pytest
        run: .venv/bin/python -m pytest

      - name: Model-B release gate
        # Vendored copy of the generic skill-release gate so remote runners (no ~/.claude) can run it.
        run: .venv/bin/python scripts/skill-release-gate.py --project-dir .

  # Validates packaging/deploy during a git-flow release (the release/* branch also hosts the
  # no-mistakes + AXI-qualification steps, run by the orchestrator).
  test-publish:
    name: Publish to TestPyPI
    needs: test
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vidushi-oa
    permissions:
      id-token: write   # OIDC trusted publishing
      contents: read    # actions/checkout needs repo read — a permissions block resets all others to none
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # AUTOMATED production release. The DEPLOY TRIGGER is a push to main (git-flow release-finish
  # merges release/* → main). The matching SemVer tag is a SAFETY CHECK, not the trigger — the job
  # refuses to publish unless main HEAD carries a tag equal to [project].version. OIDC trusted
  # publishing (`pypi` environment). No manual-reviewer gate — main is the gate.
  publish:
    name: Publish to PyPI
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vidushi-oa
    permissions:
      id-token: write   # OIDC trusted publishing
      contents: read    # actions/checkout (with fetch-tags for the safety check) needs repo read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history + tags, so the safety check can see the release tag
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Release safety check — main HEAD must carry a SemVer tag equal to [project].version
        run: |
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG=$(git tag --points-at HEAD | grep -Ex '[0-9]+\.[0-9]+\.[0-9]+.*' | head -1 || true)
          if [ -z "$TAG" ]; then
            echo "::error::main HEAD carries no SemVer tag — not a release-finish commit; refusing to publish"; exit 1
          fi
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag '$TAG' != pyproject [project].version '$VER' — refusing a mismatched publish"; exit 1
          fi
          echo "release $VER verified — tag matches [project].version"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
